<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171923">
  <title>Lexi Cloud</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#11131a;color:#f3f4f6}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center}
    .app{width:min(100%,850px);height:100dvh;display:flex;flex-direction:column;background:#171923}
    header{padding:16px 18px;border-bottom:1px solid #303442;display:flex;align-items:center;justify-content:space-between}
    h1{font-size:19px;margin:0}small{color:#aab0c0}.status{font-size:12px;color:#aab0c0}
    #messages{flex:1;overflow:auto;padding:20px 14px;display:flex;flex-direction:column;gap:14px}
    .bubble{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
    .user{align-self:flex-end;background:#39466b}.assistant{align-self:flex-start;background:#262b39}
    .welcome{margin:auto;text-align:center;color:#c5cada;padding:24px}
    form{padding:12px;display:flex;gap:8px;border-top:1px solid #303442}
    textarea{flex:1;resize:none;min-height:48px;max-height:140px;border:1px solid #41485a;border-radius:14px;background:#202431;color:white;padding:12px;font:inherit}
    button{border:0;border-radius:14px;background:#8499e8;color:#101321;padding:0 18px;font-weight:700}
    button:disabled{opacity:.5}footer{padding:0 14px 10px;color:#9299aa;font-size:11px}
    dialog{background:#202431;color:white;border:1px solid #41485a;border-radius:16px;max-width:90%;width:420px}
    dialog input{width:100%;padding:12px;margin:12px 0;background:#11131a;color:white;border:1px solid #41485a;border-radius:8px}
    .actions{display:flex;justify-content:flex-end;gap:8px}.actions button{padding:10px 14px}
  </style>
</head>
<body>
<div class="app">
  <header><div><h1>Lexi Cloud</h1><small>Tu espacio, tu memoria, tu modelo</small></div><button id="settings" type="button">Ajustes</button></header>
  <main id="messages"><div class="welcome"><h2>Hola, soy Lexi.</h2><p>Esta es nuestra base independiente. Cuando conectemos un modelo, podremos conversar aquí.</p></div></main>
  <form id="chat-form"><textarea id="message" placeholder="Escribe a Lexi…" rows="1" required></textarea><button id="send" type="submit">Enviar</button></form>
  <footer id="status">Comprobando servidor…</footer>
</div>
<dialog id="settings-dialog">
  <h3>Conexión segura</h3><p>Introduce el token privado configurado en el servidor. No pongas aquí claves del proveedor del modelo.</p>
  <input id="token" type="password" placeholder="Token de acceso (APP_TOKEN)">
  <div class="actions"><button id="close-settings" type="button">Cancelar</button><button id="save-settings" type="button">Guardar</button></div>
</dialog>
<script>
const messages = document.querySelector("#messages");
const form = document.querySelector("#chat-form");
const input = document.querySelector("#message");
const send = document.querySelector("#send");
const statusEl = document.querySelector("#status");
const dialog = document.querySelector("#settings-dialog");
let conversationId = null;
const tokenKey = "lexi_cloud_access_token";
function authHeaders(){const token=localStorage.getItem(tokenKey)||"";return token?{"Authorization":"Bearer "+token}:{}}
function addBubble(text, role){const empty=messages.querySelector(".welcome");if(empty)empty.remove();const el=document.createElement("div");el.className="bubble "+role;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}
async function checkHealth(){try{const r=await fetch("/api/health");const d=await r.json();statusEl.textContent=d.model_configured?"Servidor listo · modelo configurado": "Servidor listo · falta conectar el modelo";}catch{statusEl.textContent="No se pudo contactar el servidor"}}
form.addEventListener("submit",async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value="";addBubble(text,"user");const pending=addBubble("Estoy pensando…","assistant");send.disabled=true;
 try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json",...authHeaders()},body:JSON.stringify({message:text,conversation_id:conversationId})});const d=await r.json();if(!r.ok)throw new Error(d.detail||"Error del servidor");conversationId=d.conversation_id;pending.textContent=d.reply;}
 catch(err){pending.textContent="No pude completar la respuesta: "+err.message;}
 finally{send.disabled=false;input.focus();}});
document.querySelector("#settings").onclick=()=>{document.querySelector("#token").value=localStorage.getItem(tokenKey)||"";dialog.showModal()};
document.querySelector("#close-settings").onclick=()=>dialog.close();
document.querySelector("#save-settings").onclick=()=>{localStorage.setItem(tokenKey,document.querySelector("#token").value.trim());dialog.close();checkHealth()};
checkHealth();
</script>
</body>
</html>
